<html lang="en"><head><meta charset="utf-8"><title>card</title>
<style>

<iframe src="/web/index.html" id="f"></iframe>

<script>
document.getElementById("f").addEventListener("load", (e) => {
  const d = e.target.contentDocument, s = d.createElement("style");
  s.textContent = "#index,#card,#controls,footer{display:none!important}#app{display:block!important;height:100%!important}#scene{height:100%!important}#marks span{font-size:13px!important}";
